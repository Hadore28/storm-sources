name: Source health

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Test every source against the live site
        id: live
        continue-on-error: true
        env:
          STORM_LIVE: "1"
        run: bun test 2>&1 | tee live.log

      - name: Open or update the health issue
        if: steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The daily live check failed on $(date -u +%Y-%m-%d)."
            echo
            echo '```'
            grep -E '^\(fail\)|error:|Expected|Received' live.log | head -80
            echo '```'
          } > body.md
          existing=$(gh issue list --label source-health --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh label create source-health --color D93F0B --force
            gh issue create --title "A source is failing" --label source-health --body-file body.md
          fi
